name: API Tests - Dog API
run-name: Dog API - API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    # permitir que o test-reporter crie o check bonitinho
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Não quebra o job se teste falhar, pra gente conseguir
      # sempre publicar o relatório no GitHub
      - name: Run Maven tests
        run: mvn -B -Dmaven.test.failure.ignore=true clean test

      # 🔥 Passo que deixa os testes visíveis no GitHub (aba Checks / Summary)
      - name: Publish test results to GitHub
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Dog API - Java API Tests"          # nome que aparece no Check
          path: "target/surefire-reports/*.xml"     # XMLs do Surefire
          reporter: "java-junit"                    # tipo de reporter
          fail-on-error: true                       # falha o job se houver testes falhando

      # Mantém também os artefatos (igual você já fazia)
      - name: Package test artifacts
        if: always()
        run: |
          mkdir -p artifact
          cp -r target/surefire-reports artifact/surefire-reports || true
          cp -r target/allure-results artifact/allure-results || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: artifact
